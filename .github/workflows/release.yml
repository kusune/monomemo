name: Build and publish APK

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Check out source
              uses: actions/checkout@v5

            - name: Set up Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Set up Android SDK
              uses: android-actions/setup-android@v3
              with:
                  packages: ''

            - name: Install Android SDK packages
              run: |
                  yes | sdkmanager --licenses >/dev/null || true
                  sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            - name: Run Android smoke tests
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 35
                  target: google_apis
                  arch: x86_64
                  profile: pixel_7_pro
                  force-avd-creation: true
                  emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
                  disable-animations: true
                  script: |
                      chmod +x ./gradlew
                      ./gradlew connectedDebugAndroidTest --stacktrace

            - name: Prepare release signing key
              env:
                  KEYSTORE_BASE64: ${{ secrets.MONOMEMO_KEYSTORE_BASE64 }}
              run: |
                  test -n "$KEYSTORE_BASE64" || {
                      echo "::error::MONOMEMO_KEYSTORE_BASE64 is not configured"
                      exit 1
                  }
                  echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/monomemo-release.jks"

            - name: Build signed release APK
              env:
                  MONOMEMO_KEYSTORE_PATH: ${{ runner.temp }}/monomemo-release.jks
                  MONOMEMO_KEYSTORE_PASSWORD: ${{ secrets.MONOMEMO_KEYSTORE_PASSWORD }}
                  MONOMEMO_KEY_ALIAS: monomemo-release
                  MONOMEMO_KEY_PASSWORD: ${{ secrets.MONOMEMO_KEYSTORE_PASSWORD }}
              run: |
                  chmod +x ./gradlew
                  test -n "$MONOMEMO_KEYSTORE_PASSWORD" || {
                      echo "::error::MONOMEMO_KEYSTORE_PASSWORD is not configured"
                      exit 1
                  }
                  ./gradlew assembleRelease
                  cp app/build/outputs/apk/release/app-release.apk "MonoMemo-${GITHUB_REF_NAME}.apk"

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$GITHUB_REF_NAME" \
                      "MonoMemo-${GITHUB_REF_NAME}.apk" \
                      --title "MonoMemo ${GITHUB_REF_NAME}" \
                      --generate-notes
